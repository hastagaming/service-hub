name: Compile & Deploy Dashboard
on:
  push:
    branches:
      - main
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Transpile TypeScript into Production JavaScript
        run: |
          npm install -g typescript
          tsc script.ts --target es6 --alwaysStrict

      - name: Deploy Compiled Web Assets to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
