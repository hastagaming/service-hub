name: Anubis Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  anubis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare
        run: chmod +x ./anubis/var/anubis

      - name: Start Anubis
        env:
          BIND: 0.0.0.0:8923
          TARGET: https://hastagaming.github.io/service-hub/
          TARGET_HOST: hastagaming.github.io
          TARGET_SNI: hastagaming.github.io
          USE_REMOTE_ADDRESS: "true"
        run: ./anubis/var/anubis